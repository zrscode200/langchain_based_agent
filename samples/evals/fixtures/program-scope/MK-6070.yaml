verification_open_items:
  open:
  - production ownership and qualified review of these identifiers and per-source bindings. Nothing
    here has been reviewed by an accountable owner.
  - repetition with another program, and under different access conditions. Everything measured so
    far is one program under one caller's access.
  - correctly formed conditional INCLUSION and EXCLUSION controls per source. The exclusion identity
    (population minus the A-or-B match equals the MUST_NOT count) is verified on meds only; the impossible-condition
    control is verified on all five.
  closed_by_measurement:
  - repeatable mapping validation and drift detection — `./tools/regen_program_scope.py` regenerates
    every field list from the live index, and `index_fingerprint` below changes when the configuration
    does.
  - 'pagination beyond initial result budgets — measured: the per-request record limit has no 50 cap,
    the real ceiling is 10,000 records per request, and an offset at or past 10,000 fails loudly with
    HTTP 400 rather than returning an empty page.'
known_limitations:
- Recall and completeness are UNKNOWN. Access, indexing, ranking, truncation, and result budgets all
  shape visible coverage.
- 'Cross-source linking is weak to moderate: shared exact identifiers are inconsistently represented
  across sources, so same-study cross-source chains often cannot be established. Report that as a
  coverage limitation rather than inferring the link.'
- Distinct scientific and lifecycle roles must stay distinguishable — target profiles, validation
  records, plans, execution records, statistical analyses, reports, notebooks, presentations, publications.
  Relate them when represented identifiers support it; never deduplicate them because titles or indexed
  content are similar.
- Quoted hyphenated terms are not guaranteed to behave as literal exact matches in every datasource.
- MK-6070 and MK6070 behaved equivalently in the tested sources; alias sensitivity is otherwise source-dependent.
- 'CORRECTED 2026-08-26. This previously said some hybrid requests execute as keyword-only and that
  requested mode, effective mode and fallback must stay explicit. Measured: semantic retrieval is
  available on two of five sources. On the other three it is REFUSED rather than answered by keyword
  under a similarity label, and where a source silently returns term matches to a similarity request
  the connector detects it and says so. There is no fallback to keep explicit; `knn_available` per
  source is generated below.'
- Highlights may emphasize an opening section or table of contents and may not reliably surface later
  conclusions. Indexed text is not guaranteed to represent the complete controlled source; full-document
  review is a separate source-system and authorization concern.
- 'Extracted document text is not structurally faithful: table cells arrive as separate lines with
  row and column associations lost, so for a specification limit or acceptance criterion the locator
  is the answer rather than an extracted value.'
- The QA SSO token is short-lived; multi-call retrieval needs a shared deadline and bounded call budget.
