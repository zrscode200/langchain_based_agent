[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lc_factory"
version = "0.1.0"
description = "Agent factory layer over the LangChain ecosystem: an owned recomposition of the deepagents-code assembly."
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    # Upstream v0 baseline. The exact pin is deliberate: the factory
    # recomposes upstream internals, so every bump is a reviewed event
    # gated by the parity test suite.
    "deepagents-code==0.1.47",
    # Direct dependency (upstream.py imports `deepagents` itself), pinned to
    # the exact version deepagents-code requires. Declaring it directly also
    # lets uv resolve the pre-release. Bump both pins together.
    "deepagents==0.7.0b2",
]

[project.scripts]
lc-code = "lc_factory.tui:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lc_factory"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
