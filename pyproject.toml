[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lc_factory"
version = "0.1.0"
description = "Agent factory layer over the LangChain ecosystem: an owned recomposition of the deepagents-code assembly."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
dependencies = [
    # Reviewed post-release baseline; package versions alone do not identify
    # these workspace-isolation and filesystem fixes. Keep both source pins
    # at this exact revision and re-port the owned assembly on every update.
    "deepagents-code @ git+https://github.com/langchain-ai/deepagents.git@6c89fe2197a2dfe4f3851cda38565bcadba6066b#subdirectory=libs/code",
    "deepagents @ git+https://github.com/langchain-ai/deepagents.git@6c89fe2197a2dfe4f3851cda38565bcadba6066b#subdirectory=libs/deepagents",
    # Explicitly guard interpreter streaming and per-agent private state.
    "langchain-quickjs==0.3.7",
    # Direct use by the optional persistent conversation archive.
    "aiosqlite==0.22.1",
]

[project.scripts]
lc-code = "lc_factory.tui:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lc_factory"]

[tool.hatch.build.targets.sdist]
exclude = ["*.code-workspace"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# Resolve the published metadata of Git packages, rather than inheriting the
# upstream monorepo's editable workspace overrides for ACP and QuickJS.
no-sources = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Integration tests boot a real `langgraph dev` server; excluded from the
# default run. Execute with `uv run pytest -m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: boots a live server subprocess (slow; run explicitly)",
]
